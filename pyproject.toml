[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "installscope"
version = "0.1.0"
description = "Explain multi-wheel payload destination and ownership conflicts before installation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "gedouluhui"}]
dependencies = []

[project.scripts]
installscope = "installscope.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
